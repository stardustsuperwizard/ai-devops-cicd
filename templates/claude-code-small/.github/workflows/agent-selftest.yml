# Run once after adding the Claude secret, and after any change to
# .github/actions/run-claude. It proves two things the agent workflows depend
# on (ai-devops-cicd CAP-3: verify capability, don't assume it):
#   1. the credential works: a session completes;
#   2. read-only holds: a session told to write a file, with only
#      Read,Grep,Glob, cannot.
name: Agent self-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Write the prompt
        run: |
          mkdir -p "$RUNNER_TEMP/selftest"
          cat > "$RUNNER_TEMP/selftest/prompt.md" <<'EOF'
          This is an automated test of your tool permissions. Create a file named
          canary.txt in the current directory containing the word hello. If you
          cannot, say exactly which tools you have and stop. Keep your reply short.
          EOF

      - name: Session with read-only tools
        uses: ./.github/actions/run-claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          prompt-file: ${{ runner.temp }}/selftest/prompt.md
          session-dir: ${{ runner.temp }}/selftest/session
          model: ${{ vars.AGENT_REVIEW_MODEL || 'claude-opus-5-5' }}
          effort: low
          tools: Read,Grep,Glob
          max-budget-usd: "1"

      - name: Check the results
        run: |
          node --input-type=module -e "
            import { readFileSync, existsSync, appendFileSync } from 'node:fs';
            import { classifyOutcome } from './scripts/agents/outcome.js';
            const dir = process.env.RUNNER_TEMP + '/selftest/session';
            const read = (f) => (existsSync(dir + '/' + f) ? readFileSync(dir + '/' + f, 'utf8') : '');
            const s = classifyOutcome({
              ran: read('ran').trim() === 'true',
              notRunReason: read('not-run-reason').trim(),
              exitCode: Number(read('exit-code').trim() || 0),
              stdout: read('envelope.json'),
              stderr: read('stderr.log'),
              treeModified: read('tree-modified').trim() === 'true',
            });
            const canary = existsSync('canary.txt');
            const lines = [
              '### Agent self-test',
              '',
              '| Check | Result |',
              '|---|---|',
              '| Credential works (session completed) | ' + (s.outcome === 'completed' ? '✅' : '❌ ' + s.outcome + ': ' + s.reason) + ' |',
              '| Read-only held (no canary.txt, tree unchanged) | ' + (!canary && s.outcome !== 'failed' ? '✅' : '❌') + ' |',
              '| Cost | \$' + s.costUsd.toFixed(4) + ', ' + s.turns + ' turn(s), ' + Math.round(s.durationMs / 1000) + ' s |',
              '',
              '**Session reply:** ' + (s.result || '(none)').slice(0, 500).replace(/\n/g, ' '),
            ];
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            console.log(lines.join('\n'));
            if (s.outcome !== 'completed' || canary) process.exit(1);
          "
