name: Agent - PR Review

# TEMPLATE. The worked vertical: one role, end to end, vendor-blind.
#
# Review is the right role to port first. It is read-only, so it cannot damage
# anything, and it exercises every component of the architecture:
#
#   C1 Dispatcher        -- this file's `on:` block and the vendor resolution
#   C2 Prompt Assembler  -- Build Review Prompt, below
#   C3 Session Runner    -- ./.github/actions/run-agent-session
#   C4 Outcome Classifier-- inside run-agent-session
#   C5 Result Publisher  -- ./.github/actions/extract-review-verdict + publish
#
# Everything above the session runner is vendor-blind. The word "copilot"
# appears in this file only as a label segment and a dispatch default; nothing
# here knows which CLI will answer.
#
# TO ADAPT THIS TEMPLATE, search for TODO.
#
# See docs/building/build-guide.md, phase 5.

on:
  # Fires without a tap: review is a safety net on work you already chose to
  # start, and gating it means an unreviewed PR can sit looking finished.
  pull_request:
    types:
      - ready_for_review
      - labeled

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to review"
        required: true
        type: string
      vendor:
        description: >
          Who answers and who pays. A labelled run takes this from the label's
          third segment instead; this input exists because workflow_dispatch
          has no label to read.
        required: false
        type: choice
        options: [copilot, anthropic, claude]
        default: copilot

permissions:
  contents: read
  issues: write
  pull-requests: write
  copilot-requests: write

concurrency:
  group: agent-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Agent - PR Review
    runs-on: ubuntu-latest

    # Fire on an agent branch becoming ready, or on any agent:reviewer:* label.
    # TODO: adjust the branch prefixes to whatever your agents push.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'ready_for_review' &&
       (startsWith(github.event.pull_request.head.ref, 'copilot/') ||
        startsWith(github.event.pull_request.head.ref, 'claude/'))) ||
      (github.event.action == 'labeled' &&
       startsWith(github.event.label.name, 'agent:reviewer:'))

    env:
      # Preference list, walked in order. Advance ONLY on unavailability.
      # Overridable without a commit via a repository variable.
      # NOTE: these are CLI-native ids and are NOT portable between CLIs.
      # TODO: set your own, and check the spelling your CLI expects.
      REVIEWER_MODELS: >-
        ${{ vars.REVIEWER_MODELS ||
            'claude-opus-5,claude-opus-4.8,claude-sonnet-5' }}

    steps:
      # ── C1: resolve the vendor ────────────────────────────────────────────
      # The label's third segment chooses who answers AND who pays. Nothing
      # downstream re-derives this.
      - name: Resolve Vendor and PR
        id: ctx
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
          INPUT_VENDOR: ${{ inputs.vendor }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            VENDOR="$INPUT_VENDOR"
            PR="$INPUT_PR"
          else
            PR="$EVENT_PR"
            case "$LABEL" in
              agent:reviewer:*) VENDOR="${LABEL##*:}" ;;
              # ready_for_review has no label to read.
              *)                VENDOR="copilot" ;;   # TODO: your default
            esac
          fi

          case "$VENDOR" in
            copilot|anthropic|claude) ;;
            *) echo "::error::Unknown vendor '$VENDOR'"; exit 1 ;;
          esac

          echo "vendor=$VENDOR" >> "$GITHUB_OUTPUT"
          echo "pr=$PR"         >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the diff needs both sides of the merge

      # ── C2: assemble the prompt ───────────────────────────────────────────
      # CONTEXT ISOLATION LIVES HERE. Note which fields are NOT requested:
      # `body` is absent, deliberately. The PR body is the implementer's
      # account of its own work, and a reviewer that reads it is checking the
      # account rather than the diff.
      #
      # This is enforced by not fetching, never by an instruction to disregard.
      # See docs/rationale/04-context-isolation.md.
      #
      # TODO: replace this inline step with a composite action once you have a
      # second caller (an implementer's pre-PR self-review is the usual one).
      - name: Build Review Prompt
        id: prompt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.ctx.outputs.pr }}
        run: |
          set -euo pipefail

          # Scratch lives in $RUNNER_TEMP, never the checkout: a prompt file
          # in the working tree can end up committed.
          PROMPT="$RUNNER_TEMP/review-prompt.md"

          gh pr view "$PR" \
            --json number,title,headRefName,baseRefName,files,additions,deletions \
            > "$RUNNER_TEMP/pr.json"
          #        ^ no `body`. See the comment above.

          # The task Issue is the contract the diff is judged against.
          # TODO: your own linkage if you do not require `Closes #<n>`.
          TASK=$(gh pr view "$PR" --json closingIssuesReferences \
                   --jq '.closingIssuesReferences[0].number // empty')
          if [ -z "$TASK" ]; then
            echo "::error::PR #$PR closes no Issue; there is no contract to review against."
            exit 1
          fi
          gh issue view "$TASK" --json number,title,body > "$RUNNER_TEMP/task.json"

          gh pr diff "$PR" > "$RUNNER_TEMP/diff.patch"

          {
            echo "# Review Request"
            echo
            echo "Review the diff below against the acceptance criteria of the"
            echo "task Issue. Judge the code, not any description of it."
            echo
            echo "## Required output"
            echo
            echo 'Your FIRST line must be exactly one of:'
            echo
            echo '    VERDICT: PASS'
            echo '    VERDICT: FIX'
            echo '    VERDICT: PLANNING FAILURE'
            echo '    VERDICT: DESIGN AMBIGUITY'
            echo
            echo "Then these sections, in order:"
            echo
            echo "1. Acceptance Criteria — a table, one row per criterion, met/not met"
            echo "2. Scope — anything in the diff the Issue did not authorize"
            echo "3. Findings — each with file and line"
            echo "4. Deferred Findings — real, out of scope for this task"
            echo "5. Tests — do the new tests actually test the new behaviour?"
            echo "6. Summary"
            echo
            echo "## Task Issue"
            echo
            jq -r '"### #\(.number) — \(.title)\n\n\(.body)"' "$RUNNER_TEMP/task.json"
            echo
            echo "## Pull Request"
            echo
            jq -r '"#\(.number) — \(.title)  (\(.additions)+ \(.deletions)-)"' "$RUNNER_TEMP/pr.json"
            echo
            echo "## Diff"
            echo
            echo '```diff'
            cat "$RUNNER_TEMP/diff.patch"
            echo '```'
          } > "$PROMPT"

          echo "prompt-file=$PROMPT" >> "$GITHUB_OUTPUT"
          echo "task=$TASK"          >> "$GITHUB_OUTPUT"

      # ── C3 + C4: run the session ──────────────────────────────────────────
      # `capability: read-only` is the whole reason a reviewer cannot quietly
      # fix what it finds. It is a semantic knob, encoded per vendor inside
      # the action -- callers never pass tool flags.
      # See docs/rationale/02-capability-removal.md.
      - name: Run Review Session
        id: session
        uses: ./.github/actions/run-agent-session
        with:
          vendor: ${{ steps.ctx.outputs.vendor }}
          prompt-file: ${{ steps.prompt.outputs.prompt-file }}
          models: ${{ env.REVIEWER_MODELS }}
          capability: read-only
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # ── C5: extract the verdict ───────────────────────────────────────────
      # Gates on the session OUTCOME before honouring the verdict line. The
      # verdict comes first, so a review cut off halfway through its criteria
      # table still says "VERDICT: PASS" at the top. A session that did not
      # finish does not get to publish one.
      - name: Extract Verdict
        id: verdict
        uses: ./.github/actions/extract-review-verdict
        with:
          assistant-text-file: ${{ steps.session.outputs.assistant-text-file }}
          outcome-file: ${{ steps.session.outputs.outcome-file }}
          mode: pr

      - name: Publish Verdict
        if: steps.verdict.outputs.verdict != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.ctx.outputs.pr }}
          SLUG: ${{ steps.verdict.outputs.slug }}
          REVIEW_FILE: ${{ steps.verdict.outputs.review-file }}
        run: |
          set -euo pipefail

          gh pr comment "$PR" --body-file "$REVIEW_FILE"

          # Clear any previous verdict before setting this one. `gh pr edit
          # --add-label` adds; some API surfaces REPLACE the whole set. If
          # yours replaces, read the current labels first or you will silently
          # drop `blocker`, `model:*` and everything else.
          for old in pass fix planning-failure design-ambiguity; do
            [ "$old" = "$SLUG" ] && continue
            gh pr edit "$PR" --remove-label "review:$old" 2>/dev/null || true
          done
          gh pr edit "$PR" --add-label "review:$SLUG"

      # A failed session must say so on the PR. A review that silently produced
      # nothing is indistinguishable from one that was never requested.
      - name: Publish Failure
        if: failure() || steps.verdict.outputs.verdict == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.ctx.outputs.pr }}
          VENDOR: ${{ steps.ctx.outputs.vendor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          OUTCOME="unknown"
          if [ -f "$RUNNER_TEMP/agent-outcome.json" ]; then
            OUTCOME=$(jq -r '.outcome // "unknown"' "$RUNNER_TEMP/agent-outcome.json")
          fi

          gh pr comment "$PR" --body "$(cat <<EOF
          **Review did not complete.**

          | | |
          | --- | --- |
          | Vendor | \`$VENDOR\` |
          | Outcome | \`$OUTCOME\` |
          | Run | $RUN_URL |

          No verdict was published, deliberately: a session that did not finish
          does not get to publish one. Re-add the \`agent:reviewer:$VENDOR\`
          label to retry.
          EOF
          )"

      # ── C1, the other half: consume the trigger ───────────────────────────
      # Removing the label is what makes re-adding it a clean retry, and what
      # stops this workflow from firing on its own output.
      # `always()` so a failed run is retryable too.
      - name: Consume Trigger Label
        if: always() && github.event.action == 'labeled'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.ctx.outputs.pr }}
          LABEL: ${{ github.event.label.name }}
        run: gh pr edit "$PR" --remove-label "$LABEL" || true
